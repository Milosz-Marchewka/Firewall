<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>404 - Not Here Yet</title>
		<style>
			* {
				box-sizing: border-box;
			}

			body {
				margin: 0;
				min-height: 100vh;
				display: grid;
				place-items: center;
				background: #0f1115;
				color: #f4f1ea;
				font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
			}

			.card {
				width: min(720px, 92vw);
				padding: 2.5rem;
				border: 2px solid #2a2f3a;
				border-radius: 14px;
				background: #141821;
				box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
				text-align: center;
			}

			h1 {
				margin: 0 0 0.5rem;
				font-size: clamp(2rem, 4vw, 3rem);
			}

			p {
				margin: 0.5rem 0 0;
				font-size: 1rem;
				color: #c9c6be;
			}

			a {
				display: inline-block;
				margin-top: 1.5rem;
				padding: 0.75rem 1.2rem;
				border-radius: 10px;
				background: #ff7a00;
				color: #111;
				font-weight: 600;
				text-decoration: none;
			}

			a:hover {
				background: #ffa24d;
			}
		</style>
	</head>
	<body>
		<div class="card">
			<h1>404 - Coming soon!</h1>
			<p>We ran out of time to make documentations...</p>
			<p>Want to head back to the lobby?</p>
			<a href="/" target="_top" rel="noreferrer">Return to Lobby</a>
		</div>
	</body>
</html>
